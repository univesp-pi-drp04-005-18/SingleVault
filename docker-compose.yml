version: '3.8'

services:
  backend:
    image: svault-backend:1.0.0
    ports:
      - "8000:8000"
    environment:
      # For MongoDB Atlas, replace with your connection string
      - MONGODB_URI=mongodb+srv://single-vault:eoq1cQwr1yVuIzjm@single-vault.n4hzo2g.mongodb.net/?appName=single-vault


  frontend:
    image: svault-frontend:1.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://backend:8000
