version: '3.8'

services:
  backend:
    image: jozneto/vault-backend:1.0.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - MONGODB_USER=${MONGODB_USER}
      - MONGODB_PASS=${MONGODB_PASS}
      - MONGODB_HOST=${MONGODB_HOST}
      - MONGODB_URI=mongodb+srv://${MONGODB_USER}:${MONGODB_PASS}@${MONGODB_HOST}

  frontend:
    image: jozneto/vault-frontend:1.0.0
    ports:
      - "3000:80"

    environment:
      - REACT_APP_API_URL=http://172.200.129.185:8000
    depends_on:
      - backend